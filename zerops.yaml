zerops:
  - setup: docker
    run:
      base: docker@latest
      prepareCommands:
        - docker image pull ghcr.io/tashfeenahmed/freellmapi:v0.15.0
      start: docker run --network=host -e PORT=3001 -e ENCRYPTION_KEY=$ENCRYPTION_KEY -e FREEAPI_DB_PATH=/app/server/data/freeapi.db -e FREEAPI_CONFIG_JSON -e FREEAPI_DB_BACKUP_URL -e FREEAPI_DB_BACKUP_TOKEN ghcr.io/tashfeenahmed/freellmapi:v0.15.0
      ports:
        - port: 3001
          httpSupport: true
